[project]
name = "obsidian-bib-sync"
version = "0.1.0"
description = "Sync Obsidian paper notes to BibTeX files across your machine"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "ruamel.yaml>=0.18",
    "bibtexparser>=1.4,<2",
    "httpx>=0.27",
    "textual>=0.80",
    "tomli-w>=1.2.0",
]

[project.scripts]
obib = "obsidian_bib_sync.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_bib_sync"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
